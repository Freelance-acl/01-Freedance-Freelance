# Activated with @ActiveProfiles("test"). In-memory H2 (PostgreSQL compatibility) — no Docker DB required.
spring.application.name=proposal-service
spring.datasource.url=jdbc:h2:mem:freelance_proposal_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.devtools.restart.enabled=false
spring.main.banner-mode=off
spring.autoconfigure.exclude=\
  org.springframework.boot.cassandra.autoconfigure.CassandraAutoConfiguration,\
  org.springframework.boot.data.cassandra.autoconfigure.DataCassandraAutoConfiguration,\
  org.springframework.boot.data.cassandra.autoconfigure.DataCassandraReactiveAutoConfiguration,\
  org.springframework.boot.data.cassandra.autoconfigure.DataCassandraRepositoriesAutoConfiguration,\
  org.springframework.boot.data.cassandra.autoconfigure.DataCassandraReactiveRepositoriesAutoConfiguration

spring.rabbitmq.listener.simple.auto-startup=false

proposal-service.rabbitmq.trusted-event-package=com.team01.freelance.contracts.events

saga.payout.abandon-after=PT72H

