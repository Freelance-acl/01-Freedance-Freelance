spring.application.name=proposal-service
server.port=8080
# Default credentials match docker-compose.yaml (POSTGRES_USER/PASSWORD). Override locally when your Postgres uses different values, e.g. DB_PASS=secret in the IDE env or shell.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/freelancedb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.json_format_mapper=jackson

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
