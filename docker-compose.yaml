x-db-env: &db-env
  # Docker network hostnames — do NOT use DB_URL from .env (that is localhost for host-side mvn run)
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/freelancedb
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — see .env.example}

x-nosql-env: &nosql-env
  SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/freelancemongo?authSource=admin
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: redispass

x-job-nosql-env: &job-nosql-env
  <<: *nosql-env
  SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

x-proposal-nosql-env: &proposal-nosql-env
  <<: *nosql-env
  SPRING_DATA_NEO4J_URI: bolt://neo4j:7687
  SPRING_DATA_NEO4J_USERNAME: neo4j
  SPRING_DATA_NEO4J_PASSWORD: neo4jpass

x-contract-nosql-env: &contract-nosql-env
  <<: *nosql-env
  SPRING_CASSANDRA_CONTACT_POINTS: cassandra
  SPRING_CASSANDRA_PORT: "9042"
  SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
  SPRING_CASSANDRA_KEYSPACE_NAME: freelanceks

x-spring-mem: &spring-mem
  JAVA_TOOL_OPTIONS: >-
    -XX:+UseContainerSupport
    -Xms128m -Xmx300m
    -Djava.security.egd=file:/dev/./urandom

services:
  postgres:
    image: postgres:17
    container_name: freelance-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freelancedb
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - freelance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: freelance-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
      MONGO_INITDB_DATABASE: freelancemongo
    volumes:
      - mongo-data:/data/db
    networks:
      - freelance-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: freelance-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispass --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 320m
    networks:
      - freelance-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:latest
    container_name: freelance-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: freelancecluster
      CASSANDRA_DC: datacenter1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    mem_limit: 768m
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - freelance-network
    command: >
      bash -c "
        docker-entrypoint.sh cassandra -f &
        until cqlsh -e 'DESCRIBE KEYSPACES' 2>/dev/null; do sleep 5; done;
        cqlsh -e \"CREATE KEYSPACE IF NOT EXISTS freelanceks WITH replication = {'class':'SimpleStrategy','replication_factor':1};\";
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  neo4j:
    image: neo4j:latest
    container_name: freelance-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4jpass
      # §6.2 heap 512m — must also cap pagecache or heap+pagecache exceeds container RAM
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_pagecache_size: 256m
    mem_limit: 1g
    volumes:
      - neo4j-data:/data
    networks:
      - freelance-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  elasticsearch:
    image: elasticsearch:8.19.12
    container_name: freelance-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 768m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - freelance-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: user-service
    ports:
      - "8081:8080"
    environment:
      PORT: 8080
      SERVICE_NAME: user-service
      <<: [*db-env, *nosql-env, *spring-mem]
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freelance-network

  job-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: job-service
    ports:
      - "8082:8080"
    environment:
      PORT: 8080
      SERVICE_NAME: job-service
      <<: [*db-env, *job-nosql-env, *spring-mem]
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - freelance-network

  proposal-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: proposal-service
    ports:
      - "8083:8080"
    environment:
      PORT: 8080
      SERVICE_NAME: proposal-service
      <<: [*db-env, *proposal-nosql-env, *spring-mem]
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      job-service:
        condition: service_started
    networks:
      - freelance-network

  contract-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: contract-service
    ports:
      - "8084:8080"
    environment:
      PORT: 8080
      SERVICE_NAME: contract-service
      <<: [*db-env, *contract-nosql-env, *spring-mem]
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      job-service:
        condition: service_started
      proposal-service:
        condition: service_started
    networks:
      - freelance-network

  wallet-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: wallet-service
    ports:
      - "8085:8080"
    environment:
      PORT: 8080
      SERVICE_NAME: wallet-service
      <<: [*db-env, *nosql-env, *spring-mem]
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - freelance-network

volumes:
  pgdata:
  mongo-data:
  cassandra-data:
  neo4j-data:
  es-data:

networks:
  freelance-network:
    driver: bridge
