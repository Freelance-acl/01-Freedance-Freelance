apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proposal-service-hpa
  namespace: freelance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proposal-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Scale out when average CPU across all pods exceeds 50 %
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
