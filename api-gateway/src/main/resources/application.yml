spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/api/users/**, /api/auth/**, /api/user-skills/**
            - id: job-service
              uri: http://job-service:8080
              predicates:
                - Path=/api/jobs/**
            - id: proposal-service
              uri: http://proposal-service:8080
              predicates:
                - Path=/api/proposals/**
            - id: contract-service
              uri: http://contract-service:8080
              predicates:
                - Path=/api/contracts/**
            - id: wallet-service
              uri: http://wallet-service:8080
              predicates:
                - Path=/api/payouts/**, /api/promo-codes/**
            - id: health-check
              uri: http://user-service:8080
              predicates:
                - Path=/health
              filters:
                # user-service's public HealthController returns "OK" without auth
                # (PublicEndpoints treats any path ending in /health as public).
                - RewritePath=/health, /api/users/health

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
