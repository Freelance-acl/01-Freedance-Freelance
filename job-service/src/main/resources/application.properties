spring.application.name=job-service
server.port=8080
spring.datasource.url=jdbc:postgresql://postgres:5432/freelancedb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.json_format_mapper=jackson
contract.service.base-url=${CONTRACT_SERVICE_BASE_URL:http://contract-service:8080}
